sections:
- structure: presentation
  title:
    en: "Send supplies to your family in Gonaïves"
    fr: "Envoyez des denrées à votre famille aux Gonaïves"
  subtitle:
    en: "We deliver weekly to their doorstep"
    fr: "Nous livrons chaque semaine à leur porte"
  steps:
  - icon: "fas fa-map-marker-alt"
    text:
      en: '1\. Look at our delivery area on the map.'
      fr: '1\. Regardez notre zone de livraison sur la carte.'
    path:
      en: "https://www.google.com/maps/d/viewer?hl=en&mid=1kTrqy1gQNNubT6uPOFsTLOwsjDIuYmA&ll=19.461806183224123%2C-72.67540890000001&z=14"
      fr: "https://www.google.com/maps/d/viewer?hl=en&mid=1kTrqy1gQNNubT6uPOFsTLOwsjDIuYmA&ll=19.461806183224123%2C-72.67540890000001&z=14"
  - icon: "fas fa-sign-in-alt"
    text:
      en: '2\. Log in with your Google account.'
      fr: '2\. Connectez-vous avec votre compte Google.'
    path:
      en: "https://lakaybeta.dcycleproject.org/custom-login"
      fr: "https://lakaybeta.dcycleproject.org/fr/custom-login"
  - icon: "fab fa-whatsapp"
    text:
      en: '3\. Confirm the delivery location via WhatsApp.'
      fr: '3\. Confirmez le lieu de livraison par WhatsApp.'
    path:
      en: "https://wa.me/50936507808"
      fr: "https://wa.me/50936507808"
  - icon: "fas fa-shopping-basket"
    text:
      en: '4\. Receive your order at your doorstep.'
      fr: '4\. Recevez votre commande à votre porte.'
    path:
      en: "/products/"
      fr: "/fr/produits/"
