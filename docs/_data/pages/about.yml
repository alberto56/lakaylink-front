  text:
    en: |
      # About
      LakayLink builds on the entrepreneurial experience of Bioénergie Haïti, active since 2017, and Terre des jeunes, active since 1999. It has three goals: to fund environmental work, to create good local jobs, and to deliver food to the community in a way that is safe, hygienic and respectful.

      For the diaspora, LakayLink offers peace of mind. Members can pay by credit card from anywhere in the world, knowing their families will receive nutritious food, delivered with dignity.
    fr: |
      # À propos
      LakayLink s’appuie sur l’expérience entrepreneuriale de Bioénergie Haïti, active depuis 2017, et de Terre des jeunes, active depuis 1999. Elle poursuit trois objectifs : financer des actions environnementales, créer de bons emplois locaux et offrir à la population un service de livraison alimentaire sûr, hygiénique et respectueux.

      Pour la diaspora, LakayLink apporte la tranquillité d’esprit. Ses membres peuvent payer par carte de crédit, où qu’ils soient dans le monde, avec l’assurance que leurs proches reçoivent des aliments nutritifs, livrés dans le respect de leur dignité.
