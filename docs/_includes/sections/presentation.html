<div class="container-fluid contact py-0">
  <div class="container py-5">
    <div class="p-5 bg-light rounded">
      <div class="row g-4">
        <div class="col-12">
          <div class="text-center mx-auto wow fadeInUp" data-wow-delay="0.1s" style="max-width: 900px;">
            <h4 class="text-primary border-bottom border-primary border-2 d-inline-block pb-2">{{ _block.title[page.lang] | markdownify }}</h4>
            <p class="mb-5 fs-5 text-dark">{{ _block.subtitle[page.lang] | markdownify }}
            </p>
          </div>
        </div>
        <div class="col-lg-12">
          <div class="row g-4 align-items-center justify-content-center">
            {% for step in _block.steps %}
            <div class="col-md-6 col-lg-6 col-xl-3 wow fadeInUp" data-wow-delay="0.1s">
              <div class="rounded p-4">
                <div class="rounded-circle bg-secondary d-flex align-items-center justify-content-center mb-4"
                  style="width: 70px; height: 70px;">
                  <i class="fas fa-map-marker-alt fa-2x text-primary"></i>
                </div>
                <div>
                  <h4>
                    {{ step.text[page.lang] | markdownify }}
                  </h4>
                </div>
              </div>
            </div>
            {% endfor %}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
